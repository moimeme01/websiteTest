name: Deploy to Mac Nginx

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path:  |
            portfolio/package-lock.json
            streaming/package-lock.json
            studUPMock/package-lock.json

      - name: Build portfolio app
        run: |
          cd portfolio
          npm ci
          npm run build

      - name: Build streaming app
        run: |
          cd streaming
          npm ci
          npm run build
      
      - name: Build studUPMock frontend
        run: |
          cd studUPMock
          npm ci
          npm run build

      - name: Prepare backend directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: 2222
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            mkdir -p /Users/thibault/apps/studUPMock-backend
            mkdir -p /Users/thibault/www/websiteTest-deploy/studUPMock

      - name: Deploy root index.html
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "index.html"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"

      - name: Deploy portfolio via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "portfolio/dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}/portfolio
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
      
      - name: Deploy streaming via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "streaming/dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}/streaming
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
      
      - name: Deploy studup via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "studUPMock/dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}/studUPMock/
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"

      - name: Deploy FastAPI backend
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "studUPMock/backend/"
          TARGET: /Users/thibault/apps/studUPMock-backend/
          EXCLUDE: ".env,.venv,.*log,database.db,*.db,__pycache__"
          ARGS: "-rlgoDzvc -i --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"

      - name: Install dependencies and restart FastAPI
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: 2222
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu

            BACKEND_DIR="/Users/thibault/apps/studUPMock-backend"
            PLIST="/Users/thibault/Library/LaunchDaemons/com.thibault.studupmock-api.plist"
            LABEL="com.thibault.studupmock-api"
            CURRENT_UID="$(id -u)"

            cd "$BACKEND_DIR"

            echo "--- Checking backend files ---"
            test -f ".env"
            test -f "requirements.txt"
            test -f "settings.py"
            test -f "alembic.ini"

            echo "--- Creating virtual environment ---"
            python3 -m venv .venv

            echo "--- Installing dependencies ---"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            echo "--- Testing settings ---"
            .venv/bin/python -c \
              "from settings import Settings; s=Settings(); assert s.DATABASE_URL; print('DATABASE_URL loaded')"

            echo "--- Running database migrations ---"
            .venv/bin/alembic upgrade head

            echo "--- Testing FastAPI import ---"
            .venv/bin/python -c \
              "from app.main import app; print('FastAPI import OK')"

            echo "--- Checking LaunchDaemons directory ---"
            LAUNCH_DIR="/Users/thibault/Library/LaunchDaemons"
            sudo mkdir -p "$LAUNCH_DIR"
            sudo chmod 700 "$LAUNCH_DIR"
            ls -la "$LAUNCH_DIR" || echo "Directory empty or inaccessible"

            echo "--- Checking plist file ---"
            if [ ! -f "$PLIST" ]; then
              echo "ERROR: Plist file not found at $PLIST"
              echo "Creating plist file..."
              cat > "$PLIST" << 'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>Label</key>
                <string>com.thibault.studupmock-api</string>
                <key>ProgramArguments</key>
                <array>
                    <string>/Users/thibault/apps/studUPMock-backend/.venv/bin/python</string>
                    <string>-m</string>
                    <string>uvicorn</string>
                    <string>app.main:app</string>
                    <string>--host</string>
                    <string>127.0.0.1</string>
                    <string>--port</string>
                    <string>8000</string>
                </array>
                <key>WorkingDirectory</key>
                <string>/Users/thibault/apps/studUPMock-backend</string>
                <key>StandardOutPath</key>
                <string>/Users/thibault/apps/studUPMock-backend/api.log</string>
                <key>StandardErrorPath</key>
                <string>/Users/thibault/apps/studUPMock-backend/api-error.log</string>
                <key>EnvironmentVariables</key>
                <dict>
                    <key>PATH</key>
                    <string>/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>
                </dict>
                <key>RunAtLoad</key>
                <true/>
                <key>KeepAlive</key>
                <dict>
                    <key>SuccessfulExit</key>
                    <false/>
                </dict>
            </dict>
            </plist>
            EOF
              echo "Plist file created"
            fi

            echo "--- Fixing plist permissions ---"
            sudo chmod 644 "$PLIST"
            sudo chown root:wheel "$PLIST"
            ls -la "$PLIST"

            echo "--- Plist file details ---"
            file "$PLIST"
            echo "--- Plist content ---"
            cat "$PLIST"

            echo "--- Stopping existing LaunchDaemons ---"
            sudo launchctl bootout system "$PLIST" 2>/dev/null || true
            sleep 2

            echo "--- Starting LaunchDaemon ---"
            if ! sudo launchctl bootstrap system "$PLIST"; then
              echo "Bootstrap failed, checking launchctl status..."
              sudo launchctl print system | grep "$LABEL" || true
              exit 1
            fi

            echo "--- Waiting for FastAPI ---"
            for i in $(seq 1 30); do
              if curl --silent --show-error --fail \
                http://127.0.0.1:8000/docs > /dev/null; then
                echo "FastAPI is responding"
                exit 0
              fi
              sleep 1
            done

            echo "--- FastAPI failed to start ---"
            echo "--- launchctl status ---"
            launchctl print "gui/$CURRENT_UID/$LABEL" || true

            echo "--- backend error log ---"
            tail -n 100 "$BACKEND_DIR/api-error.log" || true

            echo "--- backend output log ---"
            tail -n 100 "$BACKEND_DIR/api.log" || true

            exit 1