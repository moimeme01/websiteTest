name: Deploy to Mac Nginx

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path:  |
            portfolio/package-lock.json
            streaming/package-lock.json
            studUPMock/package-lock.json

      - name: Build portfolio app
        run: |
          cd portfolio
          npm ci
          npm run build

      - name: Build streaming app
        run: |
          cd streaming
          npm ci
          npm run build
      
      - name: Build studUPMock frontend
        run: |
          cd studUPMock
          npm ci
          npm run build

      - name: Prepare backend directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: 2222
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            mkdir -p /Users/thibault/apps/studUPMock-backend
            mkdir -p /Users/thibault/www/websiteTest-deploy/studUPMock

      - name: Deploy root index.html
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "index.html"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"

      - name: Deploy portfolio via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "portfolio/dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}/portfolio
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
      
      - name: Deploy streaming via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "streaming/dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}/streaming
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
      
      - name: Deploy studup via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "studUPMock/dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}/studUPMock/
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ""
          SCRIPT_BEFORE: |
            ls -la
            echo "Deploying to $TARGET"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"

      - name: Deploy FastAPI backend
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: 2222
          SOURCE: "studUPMock/backend/"
          TARGET: /Users/thibault/apps/studUPMock-backend/
          EXCLUDE: ".env,.venv,.*log,database.db,*.db,__pycache__"
          ARGS: "-rlgoDzvc -i --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"

      - name: Install dependencies and restart FastAPI
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: 2222
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu

            BACKEND_DIR="/Users/thibault/apps/studUPMock-backend"

            cd "$BACKEND_DIR"

            echo "--- Checking backend files ---"
            test -f ".env"
            test -f "requirements.txt"
            test -f "./core/config.py"
            test -f "alembic.ini"

            echo "--- Creating virtual environment ---"
            python3 -m venv .venv

            echo "--- Installing dependencies ---"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            echo "--- Testing settings ---"
            .venv/bin/python -c \
              "from core.config import Settings; s=Settings(); assert s.DATABASE_URL; print('DATABASE_URL loaded')"

            echo "--- Running database migrations ---"
            .venv/bin/alembic upgrade head

            echo "--- Testing FastAPI import ---"
            .venv/bin/python -c \
              "from main import app; print('FastAPI import OK')"